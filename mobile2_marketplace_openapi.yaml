  # ==========================================
  # MARKETPLACE: Supplier Products
  # ==========================================
  /marketplace/supplier_products:
    get:
      tags: [Supplier Products]
      summary: List Supplier Products
      operationId: getSupplierProducts
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/RansackQuery'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Supplier products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierProduct'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      tags: [Supplier Products]
      summary: Publish Supplier Product (price + stock)
      description: >-
        Creates a supplier's product offer. The fields are `supplier_price` and `available_quantity`
        — **not** `price` / `quantity`.


        The controller **forces `status` to `inactive`** on create regardless of what you send; an
        admin must call `approve` to make it `active`.
      operationId: publishSupplierProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_product]
              properties:
                supplier_product:
                  type: object
                  required: [business_id, product_id, supplier_price]
                  properties:
                    business_id:
                      type: integer
                      description: Owning `Dscf::Core::Business`. Required by the model.
                      example: 5
                    product_id: { type: integer, example: 3 }
                    supplier_id:
                      type: integer
                      nullable: true
                      description: Optional `Dscf::Marketplace::Supplier` reference.
                      example: 2
                    supplier_price:
                      type: number
                      format: double
                      description: Must be greater than 0.
                      example: 325.00
                    available_quantity:
                      type: number
                      format: double
                      description: Must be >= 0.
                      example: 500
                    minimum_order_quantity:
                      type: number
                      format: double
                      nullable: true
                      description: When present, must be greater than 0.
                      example: 10
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Supplier product created successfully (status forced to `inactive`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Supplier product created successfully }
                  data:
                    $ref: '#/components/schemas/SupplierProduct'
        '422':
          description: Validation error (`errors` is a single string here)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

