    AggregatorListing:
      type: object
      description: >-
        `Dscf::Marketplace::AggregatorListingSerializer`. A listing is one of three
        `source_kind`s and carries the product's fields flattened onto it — there is no nested
        `product` or `supplier` object, and no `name` / `min_order_quantity` / `max_order_quantity`.
      properties:
        id: { type: integer, example: 14 }
        aggregator_id:
          type: integer
          description: The `Dscf::Core::Business` that owns the listing.
          example: 6
        source_kind:
          type: string
          enum: [catalog, supplier, sub_supplier]
          description: >-
            Drives which reference is required, how cost resolves, and who fulfils an order line.
            `catalog` → `product_id`; `supplier` → `supplier_product_id`;
            `sub_supplier` → `sub_supplier_product_id`.
          example: supplier
        product_id: { type: integer, nullable: true, example: 3 }
        supplier_product_id: { type: integer, nullable: true, example: 21 }
        sub_supplier_product_id: { type: integer, nullable: true }
        price:
          type: string
          description: '`decimal(15,2)` — the aggregator''s selling price. Serialized as a string.'
          example: '350.00'
        quantity:
          type: string
          description: '`decimal(15,6)`. Seeded from the upstream source on create, then decremented by orders.'
          example: '100.0'
        cost_price:
          type: string
          nullable: true
          description: Upstream cost. Null for `catalog` (no upstream to compare against).
          example: '300.00'
        margin:
          type: string
          nullable: true
          description: '`price - cost_price`; null when `cost_price` is null.'
          example: '50.00'
        status:
          type: string
          enum: [active, draft, paused, sold_out]
          description: The listing's own stored status.
          example: active
        effective_status:
          type: string
          description: >-
            Status as retailers should see it — reads `paused` when the listing is `active` but its
            upstream supplier paused or ran out of stock. Does not mutate `status`.
          example: active
        'available?':
          type: boolean
          description: '`active` AND `quantity > 0` AND upstream still offering. Key includes the `?`.'
          example: true
        total_value:
          type: string
          description: '`price * quantity`.'
          example: '35000.00'
        product_name: { type: string, nullable: true, example: Premium Ethiopian Coffee (500g) }
        product_description: { type: string, nullable: true, example: High-quality organically grown Arabica beans }
        product_category:
          type: string
          nullable: true
          description: Category **name** of the resolved product. Added in dscf-marketplace 0.15.0.
          example: Coffee
        product_category_id:
          type: integer
          nullable: true
          description: Category id of the resolved product. Added in dscf-marketplace 0.15.0.
          example: 4
        thumbnail_url: { type: string, nullable: true }
        images_urls:
          type: array
          items: { type: string }
        source_label:
          type: string
          nullable: true
          description: >-
            Who ultimately fulfils a line placed against this listing — the supplier's business name
            for `supplier`, the sub-supplier's business name for `sub_supplier`, the aggregator's own
            name for `catalog`.
          example: Kaffa Growers Co-op
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        aggregator:
          type: object
          nullable: true
          description: >-
            Nested `Business`. Present only when the controller includes associations — the `feed`
            and `my_listings` actions pass an empty include set, so it is absent there.

    Listing:
      type: object
      description: '`Dscf::Marketplace::ListingSerializer` — a supplier''s own listing.'
      properties:
        id: { type: integer, example: 55 }
        business_id: { type: integer, example: 5 }
        supplier_product_id: { type: integer, example: 21 }
        price: { type: string, example: '325.00' }
        quantity: { type: string, example: '500.0' }
        status:
          type: string
          enum: [active, draft, paused, sold_out]
          example: active
        total_value: { type: string, example: '162500.00' }
        margin: { type: string, nullable: true }
        margin_percentage: { type: string, nullable: true }
        'available?': { type: boolean, example: true }
        visible: { type: boolean, example: true }
        visibility_reason: { type: string, nullable: true }
        orchestrator_promoted: { type: boolean, example: false }
        orchestrator_promoted_at: { type: string, format: date-time, nullable: true }
        promoted_by_id: { type: integer, nullable: true }
        sole_provider: { type: boolean, example: false }
        cheapest: { type: boolean, example: true }
        total_listings_for_product: { type: integer, example: 3 }
        cheapest_price_for_product: { type: string, nullable: true, example: '325.00' }
        price_rank: { type: integer, nullable: true, example: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

