                      $ref: '#/components/schemas/ProductInclusionRequest'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      tags: [Supplier Products]
      summary: Request a New Catalog Product
      description: >-
        Submitted by a supplier when the product they want to sell is not in the catalog.
        `requested_by` is taken from the Bearer token, never from the payload.
        Send as `multipart/form-data` when attaching `product_images[]`.
      operationId: createProductInclusionRequest
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_inclusion_request]
              properties:
                product_inclusion_request:
                  type: object
                  required: [supplier_id, product_name]
                  properties:
                    supplier_id: { type: integer, example: 2 }
                    product_name: { type: string, example: Yirgacheffe Arabica 1kg }
                    product_description: { type: string, example: Washed grade 1 beans }
                    unit_of_measure: { type: string, example: Kilogram }
          multipart/form-data:
            schema:
              type: object
              properties:
                'product_inclusion_request[supplier_id]': { type: integer }
                'product_inclusion_request[product_name]': { type: string }
                'product_inclusion_request[product_description]': { type: string }
                'product_inclusion_request[unit_of_measure]': { type: string }
                'product_inclusion_request[product_images][]':
                  type: array
                  items: { type: string, format: binary }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/ProductInclusionRequest'

  # ==========================================
  # MARKETPLACE: RFQ
  # ==========================================
  /marketplace/request_for_quotations:
    get:
      tags: [RFQ]
      summary: List RFQs
      operationId: getRfqs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/RansackQuery'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: RFQs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RFQ'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      tags: [RFQ]
      summary: Initiate RFQ (Draft)
      description: >-
        Creates a `draft` RFQ. Each `rfq_items_attributes` entry requires `product_id`, `unit_id`
        (both are non-optional `belongs_to` on `RfqItem`) and a `quantity` greater than 0.


        `user_id` is permitted in the payload and is **not** derived from the token — send the
        requesting user's id.
      operationId: createRfqDraft
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_for_quotation]
              properties:
                request_for_quotation:
                  type: object
                  required: [rfq_items_attributes]
                  properties:
                    user_id: { type: integer, example: 42 }
                    notes:
                      type: string
                      maxLength: 2000
                      example: Need urgent delivery of cement.
                    status:
                      type: string
                      enum: [draft, sent, responded, selected, closed]
                      default: draft
                    rfq_items_attributes:
                      type: array
                      items:
                        type: object
                        required: [product_id, unit_id, quantity]
                        properties:
                          product_id: { type: integer, example: 3 }
                          unit_id: { type: integer, example: 9 }
                          quantity: { type: number, format: double, example: 100 }
                          notes: { type: string, maxLength: 1000 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: RFQ created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: RFQ created successfully }
                  data:
                    $ref: '#/components/schemas/RFQ'
        '422':
          description: '`Validation failed: …`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/request_for_quotations/my_rfqs:
    get:
      tags: [RFQ]
      summary: The Caller's RFQs
      description: RFQs where `user_id == current_user.id`. Not paginated.
      operationId: getMyRfqs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RansackQuery'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: RFQs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: RFQs retrieved successfully }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RFQ'

  /marketplace/request_for_quotations/{id}:
    get:
      tags: [RFQ]
      summary: Get RFQ
      description: Includes `user`, `selected_quotation`, `rfq_items` (with product + unit) and `quotations`.
      operationId: getRfq
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 12
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: RFQ details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/RFQ'

  /marketplace/request_for_quotations/{id}/send_rfq:
    post:
      tags: [RFQ]
      summary: Submit RFQ to Open Market
      description: >-
        Moves the RFQ from `draft` to `sent`. Fails (422) if the RFQ is in any other state.
        Returns the RFQ itself, not an empty envelope.
      operationId: publishRfq
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 12
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: RFQ sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: RFQ sent successfully }
                  data:
                    $ref: '#/components/schemas/RFQ'
        '422':
          description: '`Failed to send RFQ`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/request_for_quotations/{id}/close:
    post:
      tags: [RFQ]
      summary: Close RFQ
      description: Allowed from `sent` or `responded`.
      operationId: closeRfq
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: RFQ closed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: RFQ closed successfully }
                  data:
                    $ref: '#/components/schemas/RFQ'

  /marketplace/request_for_quotations/{id}/respond:
    post:
      tags: [RFQ]
      summary: Respond to RFQ (Create Quotation)
      description: >-
        Called by a supplier/wholesaler to bid on an RFQ in `draft` or `sent` state. The caller must
        own a `Dscf::Core::Business` (looked up by `user`), which becomes the quotation's business.


        **The payload is flat — it is NOT wrapped in a `quotation` object.** Permitted keys:
        `notes`, `valid_until`, `delivery_date`, `quotation_items_attributes`.


        Each item uses **`unit_price`**, not `price`. `unit_id` and `quantity` default to the RFQ
        item's own values; `quantity` is clamped to at most the requested quantity. Items whose
        `rfq_item_id` does not belong to this RFQ are silently skipped.


        Defaults: `valid_until` → 7 days from now, `delivery_date` → the date of `valid_until`.
        Model validations require `valid_until > delivery_date` and neither in the past.


        The created quotation is in status **`draft`** — the supplier must then call
        `POST /marketplace/quotations/{id}/send_quotation` before a buyer can accept it.
        Responding flips the RFQ from `sent` to `responded`.


        Returns **200**, not 201.
      operationId: respondToRfq
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quotation_items_attributes]
              properties:
                notes:
                  type: string
                  maxLength: 2000
                  example: Best price guaranteed.
                valid_until:
                  type: string
                  format: date-time
                  description: Must be after `delivery_date` and not in the past. Defaults to now + 7 days.
                  example: '2026-08-10T12:00:00.000Z'
                delivery_date:
                  type: string
                  format: date
                  description: Must not be in the past. Defaults to the date of `valid_until`.
                  example: '2026-08-01'
                quotation_items_attributes:
                  type: array
                  items:
                    type: object
                    required: [rfq_item_id, unit_price]
                    properties:
                      rfq_item_id: { type: integer, example: 145 }
                      unit_price: { type: number, format: double, example: 320.00 }
                      quantity:
                        type: number
                        format: double
                        description: Defaults to the RFQ item's quantity; clamped to it.
                        example: 100
                      unit_id:
                        type: integer
                        description: Defaults to the RFQ item's unit.
                        example: 9
                      notes: { type: string }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Quotation created (status `draft`), with `business` and `quotation_items` nested
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: RFQ response sent successfully }
                  data:
                    $ref: '#/components/schemas/Quotation'
        '422':
          description: '`Failed to respond to RFQ` — `errors` is an array of model messages.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # MARKETPLACE: Quotations
  # ==========================================
  /marketplace/quotations/my_quotes:
    get:
      tags: [Quotations]
      summary: Quotations on the Caller's RFQs
      description: >-
        Quotations joined to RFQs owned by the authenticated user — i.e. the **buyer's** view of
        bids received. Not paginated.
      operationId: getMyQuotes
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RansackQuery'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Quotations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Quotations retrieved successfully }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Quotation'

  /marketplace/quotations/{id}:
    get:
      tags: [Quotations]
      summary: Get Quotation
      description: Includes `request_for_quotation`, `business`, `quotation_items` and `order`.
      operationId: getQuotation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 88
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Quotation details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Quotation'

  /marketplace/quotations/{id}/send_quotation:
    post:
      tags: [Quotations]
      summary: Send Quotation to Buyer
      description: >-
        Moves the quotation from `draft` to `sent` (and the RFQ to `responded`). **Required before
        the buyer can accept** — `accept` refuses anything not in `sent`.
      operationId: sendQuotation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Quotation sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Quotation'

  /marketplace/quotations/{id}/accept:
    post:
      tags: [Quotations]
      summary: Accept Quotation (generates an Order)
      description: >-
        Accepts a supplier's bid. Side effects: every sibling quotation on the RFQ is set to
        `rejected`; this quotation becomes `accepted`; the RFQ becomes `selected`; and an
        `rfq_based` Order is created with status **`processing`**.


        **The payload is flat — not wrapped.** `fulfillment_type` is required and must be
        `self_pickup` or `delivery`. For `delivery`, `dropoff_address_id` is required and the
        address must belong to the caller. `payment_method` defaults to `cash`; `credit` is
        rejected.


        Preconditions enforced by `Quotation#accept!`: status must be `sent` and `valid_until` must
        be in the future — otherwise the response is 422 `Failed to accept quotation`.


        **`data` is the accepted Quotation, not the Order.** Read the created order from
        `data.order` (the `order` association is serialized) or re-fetch via
        `GET /marketplace/orders/my_orders`.
      operationId: acceptQuotation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 88
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fulfillment_type]
              properties:
                fulfillment_type:
                  type: string
                  enum: [self_pickup, delivery]
                  example: delivery
                dropoff_address_id:
                  type: integer
                  description: Required when `fulfillment_type` is `delivery`. Must belong to the caller.
                  example: 13
                payment_method:
                  type: string
                  enum: [cash, bank_transfer]
                  default: cash
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Quotation accepted; an order was generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Quotation'
        '422':
          description: >-
            `Invalid fulfillment type` / `Dropoff address is required` / `Invalid dropoff address` /
            `Credit is no longer supported for new marketplace orders` / `Failed to accept quotation`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/quotations/{id}/reject:
    post:
      tags: [Quotations]
      summary: Reject Quotation
      description: Allowed only from `sent`.
      operationId: rejectQuotation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Quotation rejected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Quotation'

  # ==========================================
  # MARKETPLACE: Orders
  # ==========================================
  /marketplace/orders:
    get:
      tags: [Orders]
      summary: List Orders (unscoped)
      description: >-
        **Returns every order in the system**, not just the caller's — the marketplace demo
        authorization bypass makes `policy_scope` resolve to `Order.all`. Use
        `GET /marketplace/orders/my_orders` for the retailer's own orders.


        Serializer includes: `user`, `ordered_by`, `ordered_to`, `quotation`, `order_items`.
      operationId: getOrders
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/RansackQuery'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Orders list loaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      tags: [Orders]
      summary: Direct Order Placement (cart checkout)
      description: >-
        Places a direct catalog order from one or more feed lines.


        **`order.order_type` must be `direct_listing`** (or the integer `1`). Without it the request
        falls through to the generic create path, which expects a `quotation_id` / `listing_id` and
        will fail validation.


        Each `order_items_attributes` entry identifies its listing either as
        `source_id` + `source_type: "Dscf::Marketplace::AggregatorListing"` (the aggregator-feed
        form the mobile app uses) or as `listing_id` + `listing_type` (`"AggregatorListing"` for a
        feed line, omitted/blank for a supplier `Listing`). `Dscf::Marketplace::SupplierProduct` is
        **not** an accepted `source_type` — supplier stock is ordered through its `Listing`.


        **Multi-seller carts return ONE order** (changed in dscf-marketplace 0.15.0 — `data` was
        previously an **array** of per-business orders). Lines are still grouped by the fulfilling
        business (an `AggregatorListing`'s aggregator, or a `Listing`'s business), but each group
        now becomes a **sub-order** under a single retailer-facing **parent order**, which is what
        `data` returns. The parent has `ordered_to_id: null` (it spans businesses), carries no
        `order_items` of its own, and nests its children under `sub_orders`; its `total_amount` is
        the sum of theirs and its `status` tracks the furthest-behind live sub-order. The response
        still carries root-level `meta: { split_by_business: true, order_count: N }` as a hint that
        the cart spanned N businesses.


        **Single-seller carts are unchanged** — one plain order, no parent, `sub_orders: []`,
        `parent_order_id: null`. That includes a multi-supplier cart from one aggregator's feed,
        which stays a single order with per-item `source` values.


        The whole checkout is one transaction — any insufficient-stock line rolls all of it back,
        parent included.


        Stock is locked and decremented per line; a source that reaches 0 is flipped to `sold_out`.


        `dropoff_address_id` is optional: for `delivery` orders, `Order#auto_assign_dropoff_address`
        falls back to the buyer's `shipping` address, then their first address, then synthesizes one
        from the linked Retailer's `location` coordinates. If none of those resolve, the order fails
        validation (`dropoff_address` is required for `delivery`).


        **Agent-assisted orders:** send `agent_id` plus `retailer_id`. The backend overwrites
        `ordered_by_id` / `user_id` with the retailer's user, and issues an OTP to the retailer's
        phone; confirm it via `POST /marketplace/orders/{id}/confirm_agent_order`.


        `payment_method` `credit` is rejected with 422.
      operationId: placeOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: object
                  required: [order_type, order_items_attributes]
                  properties:
                    order_type:
                      type: string
                      enum: [direct_listing]
                      description: Must be `direct_listing` for the cart checkout path.
                      example: direct_listing
                    user_id:
                      type: integer
                      description: Buyer. Overwritten by the backend for agent-assisted orders.
                      example: 42
                    ordered_by_id:
                      type: integer
                      description: Buyer. Overwritten by the backend for agent-assisted orders.
                      example: 42
                    dropoff_address_id:
                      type: integer
                      description: Optional; auto-resolved for `delivery` when omitted.
                      example: 13
                    payment_method:
                      type: string
                      enum: [cash, bank_transfer]
                      default: cash
                      description: '`credit` is rejected (422).'
                    fulfillment_type:
                      type: string
                      enum: [delivery, self_pickup]
                      description: Required by the model; no implicit default on this path.
                      example: delivery
                    received_bank_name:
                      type: string
                      description: Only for `bank_transfer`; cleared when `payment_method` is `cash`.
                    transaction_reference:
                      type: string
                      description: Only for `bank_transfer`; cleared when `payment_method` is `cash`.
                    agent_id:
                      type: integer
                      nullable: true
                      description: Set when an agent places the order on a retailer's behalf.
                      example: 7
                    retailer_id:
                      type: integer
                      nullable: true
                      description: Required alongside `agent_id`; the retailer must have a linked user account.
                      example: 31
                    order_items_attributes:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [quantity]
                        properties:
                          quantity:
                            type: number
                            format: double
                            description: Must be greater than 0 and within the listing's available quantity.
                            example: 10
                          source_id:
                            type: integer
                            description: AggregatorListing id, when paired with `source_type`.
                            example: 14
                          source_type:
                            type: string
                            enum: [Dscf::Marketplace::AggregatorListing]
                            description: >-
                              Only the aggregator-listing value is honoured on this path. The stored
                              `source` is re-derived server-side: `supplier`-kind listings are sourced
                              straight to the fulfilling `Dscf::Core::Business`, while `catalog` and
                              `sub_supplier` stay sourced to the `AggregatorListing`.
                            example: Dscf::Marketplace::AggregatorListing
                          listing_id:
                            type: integer
                            description: Alternative to `source_id`.
                          listing_type:
                            type: string
                            enum: [AggregatorListing]
                            description: Omit for a supplier `Listing`; `AggregatorListing` for a feed line.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: >-
            Order created. `data` is **always a single Order object** — a plain order for a
            single-seller cart, or the parent order (with `sub_orders` populated) when the cart
            spanned several sellers. It was an array in the multi-seller case before 0.15.0.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Order created successfully }
                  data:
                    $ref: '#/components/schemas/Order'
                  meta:
                    type: object
                    description: Present only when the cart spanned several sellers.
                    properties:
                      split_by_business: { type: boolean, example: true }
                      order_count:
                        type: integer
                        description: Number of sub-orders under the parent.
                        example: 2
        '422':
          description: >-
            `At least one item is required` / `Quantity must be greater than 0` /
            `Listing is not available` / `Requested quantity exceeds available listing quantity for …` /
            `Retailer not found` / `Retailer has no linked user account to order on behalf of` /
            `Credit is no longer supported for new marketplace orders`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/orders/my_orders:
    get:
      tags: [Orders]
      summary: The Retailer's Own Orders
      description: >-
        Orders where `ordered_by == current_user`. **This is the retailer app's order list.**
        Not paginated; supports Ransack `q`.


        **Sub-orders are excluded** (filtered on `parent_order_id IS NULL`, since 0.15.0). A
        multi-seller checkout appears as exactly **one** row — the parent — with its per-business
        children nested under `sub_orders`. Before 0.15.0 the same checkout appeared as N separate
        rows. Filtering/sorting on `q[status_eq]` works on the parent's aggregated status.
      operationId: getMyOrders
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RansackQuery'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Orders retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'

  /marketplace/orders/{id}:
    get:
      tags: [Orders]
      summary: View Order Details
      description: >-
        Within a single seller's order, allocations are **not** child orders — each lives on an
        `order_items[]` entry via its `source_type` / `source_id` and per-item `status`.


        A **parent order** (multi-seller cart, since 0.15.0) is the one case with child rows: it has
        `ordered_to_id: null`, an empty `order_items`, and its per-business children under
        `sub_orders` — read the line items from `sub_orders[].order_items`.


        Serializer includes for `show`: `user`, `ordered_by`, `ordered_to`, `quotation`, `listing`,
        `delivery_order`, `order_items`, `sub_orders.order_items`.
      operationId: getOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 240
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Order details loaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Order'

  /marketplace/orders/{id}/retailer_confirm:
    post:
      tags: [Orders]
      summary: Retailer Final Confirmation
      description: >-
        The retailer's single final action. Guarded by `Order#retailer_can_confirm?`, i.e. `status`
        must be `waiting_retailer_confirmation` **or** already `confirmed` (re-confirm is tolerated);
        anything else returns 422 `Order not ready for retailer confirmation`.


        `confirmed: true` → order `confirmed` and **all** order items set to `confirmed`.
        Any value other than the literal boolean `false` is treated as confirm.

        `confirmed: false` → order `cancelled`, all items `cancelled`, and `reason` recorded on the
        notification body.


        Items dropped during splitting arrive as `order_items[]` with `status: cancelled` and are
        excluded from `total_amount` — surface them so the retailer sees the final basket first.


        **Call this on the parent for a multi-seller cart** (since 0.15.0). The decision fans out to
        every sub-order that is itself ready; sub-orders still awaiting their supplier are left
        untouched and come back for confirmation later. Readiness on a parent means *at least one*
        sub-order is ready — 422 only when none are. The parent's own status follows from its
        children, so it may land on `confirmed` or stay mid-flight.


        **Returns the full Order** (with `show` includes), not a `{ id, status }` stub.
      operationId: retailerConfirmOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 240
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed:
                  type: boolean
                  description: '`false` cancels the order; anything else confirms it.'
                  example: true
                reason:
                  type: string
                  description: Cancellation note, surfaced in the buyer notification.
                  example: Rejected due to updated pricing.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Retailer decision saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Order'
        '422':
          description: '`Order not ready for retailer confirmation`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/orders/{id}/supplier_confirm:
    post:
      tags: [Orders]
      summary: Supplier Order-Level Confirmation
      description: >-
        Order-level decision by a supplier for an order allocated to them.


        `confirmed: false` cancels every one of the order's items currently in `processing`.
        `confirmed: true` is currently a **no-op on item status** — the service only re-checks
        whether all allocations have responded. Either way, once
        `Order#supplier_confirmation_complete?` holds (every item is `cancelled`, or has a
        `source_id` and status `confirmed`), the order advances to `waiting_retailer_confirmation`.


        Per-item supplier self-confirmation of aggregator-split allocations is not exposed here —
        for split orders the aggregator calls the admin-side `confirm_item`.


        **Returns the full Order**; there is no `supplier_confirmed` field on the payload.
      operationId: supplierConfirmOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 241
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed:
                  type: boolean
                  description: Only the literal boolean `false` is treated as a rejection.
                  example: true
                reason:
                  type: string
                  example: Out of stock for line 2.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Supplier decision saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Order'
        '422':
          description: Service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/orders/{id}/confirm:
    post:
      tags: [Orders]
      summary: Confirm Order (legacy fast path)
      description: >-
        Legacy single-step confirmation. `Order#confirm!` only succeeds when `status == pending`;
        it sets the order and all items to `confirmed`. Agent-assisted orders must have a verified
        OTP first. Prefer `retailer_confirm` for the split-order workflow.
      operationId: confirmOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Order confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Order'
        '422':
          description: '`Order awaits retailer OTP confirmation`, or the order was not `pending`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/orders/{id}/confirm_agent_order:
    post:
      tags: [Orders]
      summary: Confirm an Agent-Assisted Order with the Retailer's OTP
      description: >-
        The agent enters the OTP the retailer received. This does **not** change `status` — it only
        unblocks `validate` / `confirm`. Requires the order to have an `agent_id`.
      operationId: confirmAgentOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_code]
              properties:
                otp_code: { type: string, example: '482913' }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Order'
        '422':
          description: >-
            `Order was not placed by an agent` / `No OTP has been sent for this order` /
            `OTP has expired, request a new one` / `Too many incorrect attempts, request a new OTP` /
            `Incorrect OTP`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/orders/{id}/resend_agent_order_otp:
    post:
      tags: [Orders]
      summary: Resend the Agent-Order OTP
      description: >-
        Regenerates and re-sends the OTP to the phone on the most recent OTP record, falling back to
        the linked Retailer's phone.
      operationId: resendAgentOrderOtp
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: OTP re-sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Order'
        '422':
          description: >-
            `Order was not placed by an agent` / `No retailer phone number on file for this order`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/orders/{id}/reorder:
    post:
      tags: [Orders]
      summary: Reorder a Past Order
      description: >-
        One-tap reorder: rebuilds a past order's basket and places it again as a NEW order.
        Takes no request body — everything comes from the order at `{id}`.


        **Lines are re-resolved, not replayed.** An order line records the *product*, not the
        aggregator listing it came from (a `supplier`-sourced feed line stores the fulfilling
        business as its `source`), so each line is matched against what the same seller offers
        today. Two consequences worth designing for:

        - **The new order is priced at today's price**, which may differ from the original.
          Show the returned `total_amount`, don't reuse the old one.

        - A feed line may resolve to a *different* `AggregatorListing` for the same product
          under the same aggregator. The seller never changes; a supplier `Listing` line is
          re-found by id and skipped rather than silently moved to another supplier.


        **Partial by design.** Lines that can no longer be sourced are skipped and lines short
        on stock are clamped down, both reported in `meta` — one sold-out item doesn't block the
        rest. Surface `skipped_items` / `adjusted_items` to the buyer. Only when *nothing* can be
        sourced does the call fail (422).


        **A cancelled order can be reordered** — re-placing an order that failed is the main
        reason to reorder at all, so all of its lines come along. On a still-live order a
        cancelled *line* was deliberately removed during validation or refused by its supplier,
        and that decision stands: it is not carried over.


        Reordering a parent order reorders the whole cart and may split again. `agent_id` is
        deliberately not copied — a reorder is the retailer acting for themselves, so it skips
        the agent OTP gate.
      operationId: reorderOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The order being reordered. May be a standalone, parent or sub-order.
          schema: { type: integer }
          example: 294
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: >-
            New order created. Same shape as a checkout response — a single order, or the parent
            when the rebuilt cart spans several sellers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Order'
                  meta:
                    type: object
                    properties:
                      reordered_from:
                        type: integer
                        description: The order this was rebuilt from.
                        example: 294
                      reordered_items:
                        type: integer
                        description: Lines actually placed.
                        example: 3
                      skipped_items:
                        type: array
                        description: Lines that could not be sourced at all.
                        items:
                          type: object
                          properties:
                            product_id: { type: integer, example: 12 }
                            product_name: { type: string, nullable: true, example: Berbere }
                            reason:
                              type: string
                              enum: [no_longer_available, out_of_stock, invalid_quantity]
                              example: out_of_stock
                      adjusted_items:
                        type: array
                        description: Lines placed at a reduced quantity.
                        items:
                          type: object
                          properties:
                            product_id: { type: integer, example: 15 }
                            product_name: { type: string, nullable: true, example: Teff }
                            requested_quantity:
                              type: string
                              description: Decimal, serialized as a string like every other quantity in this API.
                              example: '6.0'
                            quantity:
                              type: string
                              description: Decimal, serialized as a string. What was actually ordered.
                              example: '4.0'
                            reason: { type: string, enum: [insufficient_stock], example: insufficient_stock }
                      split_by_business:
                        type: boolean
                        description: Present only when the rebuilt cart spanned several sellers.
                        example: true
                      order_count:
                        type: integer
                        description: Number of sub-orders under the parent.
                        example: 2
        '422':
          description: >-
            One of:
            `None of the items on order #N are available to reorder` — lines exist but none could
            be sourced; the response carries a root-level `skipped_items` giving a reason for each.
            `Order #N has no reorderable items (…)` — the order has no lines to work from at all.
            `Only direct listing orders can be reordered` — for an RFQ-based order.
            An unknown order id returns 404, not 422.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel Order
      description: >-
        Sets the order to `cancelled` and every order item to `cancelled`. No state guard — an
        already-completed order can be cancelled. Takes no request body.


        **On a parent order** (since 0.15.0) this cancels every sub-order that hasn't already
        `completed`, along with their items; the parent's status follows. Cancel the parent, not the
        children — cancelling one child leaves the rest of the cart live.


        **Returns the full Order.** Because no serializer `include` is passed, the default
        association set is emitted.
      operationId: cancelOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 240
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Cancellation completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Order'

  # ==========================================
  # MARKETPLACE: Retailers & Agents
  # ==========================================
  /marketplace/retailers/register:
    post:
      tags: [Retailers & Agents]
      summary: Register a Retailer (self-service or agent-assisted)
      description: >-
        Public endpoint using the same atomic retailer-registration coordinator as
        `/core/auth/signup`. The canonical form supplies `user`, `retailer`, and `address`.
        The legacy form keeps phone/password and a strict `"latitude,longitude"` value inside
        `retailer`.


        If a Bearer token is supplied, the retailer is attributed to the Agent owned by that token's
        user and `onboarded_at` is stamped. There is **no client-supplied `agent_id`** on this
        payload.


        Invalid addresses, category ids, conflicting phones, or model validation errors roll back
        the User, profile, role, Retailer, Address, and preferences together.
      operationId: registerRetailer
      security: []   # public — but a Bearer token, if sent, attributes the retailer to that agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retailer]
              properties:
                user:
                  type: object
                  description: Canonical account and profile attributes. Omit only for the legacy payload.
                  properties:
                    email: { type: string, format: email }
                    phone: { type: string, example: '+251911998877' }
                    password: { type: string, format: password }
                    password_confirmation: { type: string, format: password }
                    user_profile_attributes:
                      type: object
                      properties:
                        first_name: { type: string, example: Abebe }
                        last_name: { type: string, example: Kebede }
                        gender: { type: string, enum: [male, female] }
                        date_of_birth: { type: string, format: date }
                retailer:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, example: Bole Corner Store }
                    phone:
                      type: string
                      description: Derived from `user.phone` in canonical requests and must match it if supplied.
                      example: '+251911998877'
                    tin_number: { type: string, example: '1234567890' }
                    location:
                      type: string
                      description: Legacy strict `"latitude,longitude"` fallback.
                      example: '9.0115,38.7578'
                    branch_count: { type: integer, minimum: 1, nullable: true }
                    preferred_category_ids:
                      type: array
                      uniqueItems: true
                      items: { type: integer }
                    password: { type: string, format: password }
                    password_confirmation: { type: string, format: password }
                address:
                  $ref: '#/components/schemas/RegistrationAddress'
      responses:
        '201':
          description: Retailer registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Retailer'
        '422':
          description: Validation error — `errors` is an array of model messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/retailers/my_retailers:
    get:
      tags: [Retailers & Agents]
      summary: Retailers Onboarded by the Calling Agent
      description: >-
        Resolves the `Agent` owned by the authenticated user and returns retailers with that
        `agent_id`. Returns an empty array when the user is not an agent. Not paginated.
      operationId: getMyRetailers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RansackQuery'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Retailers retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Retailer'

  /marketplace/retailers/{id}:
    get:
      tags: [Retailers & Agents]
      summary: Get Retailer
      operationId: getRetailer
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Retailer details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Retailer'

  /marketplace/agents/register:
    post:
      tags: [Retailers & Agents]
      summary: Register an Agent
      description: >-
        Creates an `Agent` record (no user account is created here — use `/core/auth/signup` with an
        `agent` object for self-onboarding). `code` is generated server-side as `AGT-XXXXXXXX`.
        `verification_status` starts at `pending`.


        Send as `multipart/form-data` to attach `photo` / `national_id`.
      operationId: registerAgent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent:
                  type: object
                  required: [name, phone, service_area]
                  properties:
                    name: { type: string, example: Bole Agent PLC }
                    phone: { type: string, example: '+251911223344' }
                    service_area: { type: string, example: Bole Subcity }
                    sub_city: { type: string, example: Bole }
                    woreda: { type: string, example: '03' }
                    gender: { type: string, example: Male }
                    fayda_number: { type: string, example: '123456789012' }
                    user_id: { type: integer, nullable: true }
                    onboarded_by_id:
                      type: integer
                      nullable: true
                      description: The `Dscf::Core::Business` that onboarded this agent.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Agent registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Agent registered successfully }
                  data:
                    $ref: '#/components/schemas/Agent'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/agents/{id}/verify:
    post:
      tags: [Retailers & Agents]
      summary: Verify or Reject an Agent
      description: >-
        Single endpoint for both outcomes: **sending a `reason` rejects**; omitting it verifies.
        On rejection the agent gets `verification_status: rejected`, `rejection_reason` and
        `rejected_at`.
      operationId: verifyAgent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Present ⇒ reject. Absent ⇒ verify.
                  example: National ID photo is unreadable.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Agent verified or rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Agent'
        '422':
          description: Update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marketplace/agents/{id}/modify_location:
    post:
      tags: [Retailers & Agents]
      summary: Modify Agent Service Location
      description: >-
        Overwrites `service_area`, `sub_city` and `woreda` with the values sent and stamps
        `modified_at`. **All three are assigned unconditionally** — omitting one sets it to `null`.
        Parameters are top-level, not nested under `agent`.
      operationId: modifyAgentLocation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_area: { type: string, example: Yeka Subcity }
                sub_city: { type: string, example: Yeka }
                woreda: { type: string, example: '08' }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Location modified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Agent'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: >-
        Page number. **Pagination is applied only when this parameter is present** — omit it to get
        the full result set with no `pagination` object.
      schema:
        type: integer
        minimum: 1
        example: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Page size. Defaults to 10.
      schema:
        type: integer
        default: 10
    OrderBy:
      name: order_by
      in: query
      required: false
      description: >-
        Sort column. Values outside the controller's whitelist silently fall back to `id`.
        The base whitelist is `id`, `created_at`, `updated_at`.
      schema:
        type: string
        default: id
    OrderDirection:
      name: order_direction
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    RansackQuery:
      name: q
      in: query
      required: false
      style: deepObject
      explode: true
      description: >-
        Ransack predicate hash, e.g. `q[status_eq]=active`. Only attributes declared in the model's
        `ransackable_attributes` are honoured; unknown keys are ignored.
      schema:
        type: object
        additionalProperties:
          type: string

  responses:
    Unauthorized:
      description: >-
        Missing/expired token. Raised by the token layer, so the body **does not** use the standard
        envelope.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: Session expired }
              status: { type: integer, example: 401 }

  schemas:
    SuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message:
          type: string
          description: Present only when an i18n key resolved. Do not parse.
          example: Action completed successfully
        data:
          description: Shape varies per endpoint; may be null.
          oneOf:
            - type: object
            - type: array
              items: {}

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: string
          description: Only set when the controller passed a resolvable i18n key.
          example: Failed to create supplier product
        errors:
          description: >-
            A **string** for most create/update failures (`full_messages[0]`), an **array** for
            endpoints that pass `full_messages`.
          oneOf:
            - type: string
              example: Supplier price must be greater than 0
            - type: array
              items: { type: string }
              example: ["Email has already been taken", "Phone is invalid"]

    Pagination:
      type: object
      description: Emitted only when the request carried a `page` parameter.
      properties:
        current_page: { type: integer, example: 1 }
        per_page: { type: integer, example: 10 }
        count:
          type: integer
          description: Records on this page.
          example: 10
        total_count: { type: integer, example: 137 }
        total_pages: { type: integer, example: 14 }
        links:
          type: object
          properties:
            first: { type: string, example: '/marketplace/orders?page=1&per_page=10' }
            prev: { type: string, nullable: true, example: null }
            next: { type: string, nullable: true, example: '/marketplace/orders?page=2&per_page=10' }
            last: { type: string, example: '/marketplace/orders?page=14&per_page=10' }

    AuthUser:
      type: object
      description: '`Dscf::Core::UserAuthSerializer` — used by signup, login and `/core/auth/me`.'
      properties:
        id: { type: integer, example: 42 }
        email: { type: string, nullable: true, example: retailer@example.com }
        phone: { type: string, nullable: true, example: '+251911223344' }
        verified_at: { type: string, format: date-time, nullable: true }
        permissions:
          type: array
          description: Flattened list of the user's active permission records.
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: string, example: orders.create }
              name: { type: string, example: Create orders }
        review_status:
          type: object
          nullable: true
          description: >-
            Resolved in priority order: an Agent for this user, else a Supplier reached via the
            user's Business, else a Retailer (whose `status` is hard-coded to `pending`), else null.
          properties:
            type:
              type: string
              enum: [agent, supplier, retailer]
              example: retailer
            entity_id: { type: integer, example: 5 }
            status: { type: string, example: pending }
        user_profile:
          $ref: '#/components/schemas/UserProfile'
        roles:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, example: 1 }
              code: { type: string, example: RETAILER }
              name: { type: string, example: Retailer }
              description: { type: string, nullable: true }
              active: { type: boolean, example: true }
              permissions:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    code: { type: string }
                    name: { type: string }

