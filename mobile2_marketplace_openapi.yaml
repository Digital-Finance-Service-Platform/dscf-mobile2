  # ==========================================
  # MARKETPLACE: Aggregator Feed
  # ==========================================
  /marketplace/aggregator_listings/feed:
    get:
      tags: [Aggregator Feed]
      summary: Retailer-Facing Products Feed
      description: >-
        **This is the endpoint the retailer app should use.** Returns aggregator listings whose own
        `status` is `active` **and** whose upstream source is still offerable
        (`AggregatorListing#available?`): for `supplier`-sourced listings the supplier product must
        be `active` with positive stock; for `sub_supplier` the sub-supplier product must exist;
        `catalog` listings have no upstream.


        Availability is resolved **in SQL** (`AggregatorListing.offerable`), so this endpoint
        **supports Ransack filtering (`q`) and pagination** (since dscf-marketplace 0.15.0 —
        it previously ignored both). No associations are nested (`include` is empty) — use the
        flattened `product_name` / `product_category` / `thumbnail_url` / `source_label` attributes.


        **Product filters resolve across every `source_kind`.** Which column holds the product
        depends on how the listing was sourced (`product_id` for `catalog`,
        `supplier_product.product_id` for `supplier`, `sub_supplier_product.product_id` for
        `sub_supplier`), so these are exposed as Ransack virtual attributes that resolve the
        product regardless. All standard Ransack predicates apply (`_eq`, `_cont`, `_start`,
        `_i_cont`, `_not_eq`, `_in`, …); use `_cont` for partial search — it maps to `ILIKE`
        and is case-insensitive. Multiple `q` params combine with AND.
      operationId: getAggregatorFeed
      security:
        - BearerAuth: []
      parameters:
        - name: q[product_name_cont]
          in: query
          required: false
          description: Partial, case-insensitive product-name search. Use `q[product_name_eq]` for an exact match.
          schema: { type: string, example: Berbere }
        - name: q[product_description_cont]
          in: query
          required: false
          description: Partial, case-insensitive product-description search.
          schema: { type: string }
        - name: q[product_category_eq]
          in: query
          required: false
          description: >-
            Filter by category **name** (not id), so the client doesn't have to look the category
            up first. `q[product_category_cont]` also works.
          schema: { type: string, example: Spices }
        - name: q[product_category_id_eq]
          in: query
          required: false
          description: Filter by category id.
          schema: { type: integer }
        - name: q[price_gteq]
          in: query
          required: false
          description: Minimum price (inclusive). Pair with `q[price_lteq]` for a range.
          schema: { type: number, format: float, example: 100 }
        - name: q[price_lteq]
          in: query
          required: false
          description: Maximum price (inclusive).
          schema: { type: number, format: float, example: 500 }
        - name: q[source_kind_eq]
          in: query
          required: false
          schema:
            type: string
            enum: [catalog, supplier, sub_supplier]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: order_by
          in: query
          required: false
          description: >-
            Sort column. Whitelist for this endpoint is `id`, `created_at`, `updated_at`, `price`,
            `quantity`. Values outside it silently fall back to `id`.
          schema:
            type: string
            default: id
            enum: [id, created_at, updated_at, price, quantity]
        - $ref: '#/components/parameters/OrderDirection'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Feed retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AggregatorListing'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /marketplace/aggregator_listings:
    get:
      tags: [Aggregator Feed]
      summary: Query Aggregator Listings (unfiltered index)
      description: >-
        Standard index over **all** aggregator listings regardless of status or upstream
        availability (the demo authorization bypass makes `policy_scope` resolve to `scope.all`).
        Prefer `/feed` for the retailer app.


        Ransackable attributes: `id`, `aggregator_id`, `supplier_product_id`, `product_id`,
        `sub_supplier_product_id`, `source_kind`, `price`, `quantity`, `status`, `created_at`,
        `updated_at`. **`name` is not ransackable** — it is delegated from the product, so
        `q[name_cont]` does not filter.
      operationId: getAggregatorListings
      security:
        - BearerAuth: []
      parameters:
        - name: q[status_eq]
          in: query
          description: Filter by listing status.
          required: false
          schema:
            type: string
            enum: [active, draft, paused, sold_out]
        - name: q[source_kind_eq]
          in: query
          required: false
          schema:
            type: string
            enum: [catalog, supplier, sub_supplier]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/OrderDirection'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Listings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AggregatorListing'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /marketplace/aggregator_listings/my_listings:
    get:
      tags: [Aggregator Feed]
      summary: Aggregator's Own Listings
