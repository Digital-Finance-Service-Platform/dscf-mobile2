openapi: 3.0.0
info:
  title: DSCF Mobile2 Marketplace API
  description: >-
    OpenAPI specification for the **Supply Chain Financing (DSCF) Mobile2 Client Application**,
    verified against the `dscf-core` (v0.3.14) and `dscf-marketplace` (v0.13.13) Rails engines as
    mounted by `dscf-api`.


    ### Engines & namespaces

    * **Core Engine (`/core`)** — authentication, profile, addresses, businesses, documents, Fayda KYC.

    * **Marketplace Engine (`/marketplace`)** — catalog, listings, aggregator feed, RFQs, quotations,
      orders, supplier products, retailers, agents.


    ### Authentication

    Non-public endpoints require `Authorization: Bearer <access_token>`. Tokens come from
    `POST /core/auth/login`; `POST /core/auth/refresh` exchanges a `refresh_token` for a new
    access token.


    **Public (no token) endpoints:** `/core/auth/signup`, `/core/auth/login`, `/core/auth/refresh`,
    `/core/fayda/verify`, `/marketplace/retailers/register`.


    > `/marketplace/retailers/register` and `/core/auth/signup` skip *authentication* but still read
    > `current_user` if a token is sent — an agent onboarding a retailer attaches their own token and
    > the backend derives the onboarding agent from it. There is no client-supplied `agent_id` on
    > those payloads.


    ### Authorization (current state)

    `Dscf::Marketplace::ApplicationController` currently applies a **temporary demo bypass**: any
    authenticated user is treated as a super-admin for every marketplace policy check and every
    `policy_scope`. Collection endpoints such as `GET /marketplace/orders` therefore return **all**
    records, not just the caller's. Use the `my_*` endpoints (`/orders/my_orders`,
    `/listings/my_listings`, `/supplier_products/my_products`, `/retailers/my_retailers`,
    `/request_for_quotations/my_rfqs`, `/quotations/my_quotes`) for caller-scoped data.


    ### Response envelope

    Success (`Dscf::Core::JsonResponse#render_success`):

    ```json

    { "success": true, "message": "…", "data": …, "pagination": { … } }

    ```

    `message` is present only when the controller passed an i18n key or a matching
    `<model>.success.<action>` key exists. `pagination` appears only on paginated index calls.
    Some actions merge extra root-level keys (e.g. `meta`) — documented per endpoint.


    Error (`render_error`):

    ```json

    { "success": false, "error": "…", "errors": "…" | ["…"] }

    ```

    `errors` is a **string** for most `create`/`update` failures (`obj.errors.full_messages[0]`) and
    an **array** for a few endpoints. `error` is only set when an i18n key resolved.


    Authentication failures raised by the token layer bypass this envelope entirely and return
    `{ "error": "Session expired", "status": 401 }` — no `success` field.


    ### Pagination & filtering

    Pagination is **opt-in**: it is applied only when the `page` query parameter is present.
    Without `page` the full result set is returned and no `pagination` object is emitted.
    Default `per_page` is **10**. Sorting uses `order_by` (whitelisted per controller, default `id`)
    and `order_direction` (`asc` | `desc`).


    Ransack filtering uses `q[<attribute>_<predicate>]`. Only attributes listed in each model's
    `ransackable_attributes` are accepted; delegated attributes (e.g. an aggregator listing's
    `name`, which comes from the product) are **not** filterable.


    ### Serialization notes

    * Boolean/predicate serializer attributes keep their `?` in the JSON key —
      `"available?"`, `"in_stock?"`, `"complete?"`, `"has_responses?"`, `"matches_rfq_request?"`.

    * `decimal` columns (prices, quantities, latitude, longitude) serialize as **strings**.

    * Associations are only nested when the controller passes them in the serializer `include`
      option; the sets differ per action and are noted on each endpoint.


    ### Known backend defects (documented, not hidden)

    * Every `orders.*` and `quotations.*` i18n key used by `OrdersController` / `QuotationsController`
      is missing from `dscf_marketplace/config/locales/en.yml` (the file defines singular `order:` /
      `quotation:` sections). Those responses return
      `message: "Translation missing: en.orders.success.cancelled"` and similar. Clients must not
      parse `message`.

    * `POST /core/businesses/{business_id}/documents` ignores the submitted `document_type` and
      always creates a `business_license` document.

    * `POST /core/fayda/verify` is a **mock** — it validates the format of `fayda_number` and returns
      canned identity data. It does not contact the national registry and takes no OTP.


    ### Order lifecycle (state machine)

    | # | `status` | Who acts | Meaning |

    |---|----------|----------|---------|

    | 1 | `pending` / `validating` | system / aggregator | Order received; items validated against current listings. |

    | 2 | `splitting` | aggregator | All items validated; sources being assigned across suppliers. |

    | 3 | `waiting_supplier_confirmation` | aggregator / supplier | Each allocation is confirmed (or not-confirmed with a reason) per item. |

    | 4 | `waiting_retailer_confirmation` | **retailer** | Every allocation responded; consolidated order awaits the retailer's final confirm. |

    | 5 | `confirmed` | system | Retailer confirmed; order moves to consolidation/fulfilment. |

    | 6 | `processing` | system | Legacy/fulfilment state (also the state RFQ-based orders are created in). |

    | 7 | `completed` | system / supplier | Order fulfilled. |

    | – | `cancelled` | any | Order/allocation rejected. |


    **Retailer client rule:** show confirm / cancel only when
    `status == waiting_retailer_confirmation` (the backend guard is
    `waiting_retailer_confirmation? || confirmed?`). Use `has_validation_issues` and each
    `order_items[].status` to show which lines survived splitting. Lines that a supplier did not
    confirm come back as `cancelled` and are excluded from `total_amount`.


    **Aggregator-only order endpoints** (`validate`, `resolve_item`, `assign_source`, `split`,
    `confirm_item`, `adjust_item`, `accept_adjustment`, `reject_adjustment`, `reopen_item`,
    `complete`, `invoice`, `filter`) exist on the same controller but belong to the admin dashboard
    and are out of scope for this mobile spec.
  version: 2.0.0
servers:
  - url: https://uat.api.fcgm.pro.et
    description: 'UAT Sandbox Environment'

tags:
  - name: Auth
    description: 'Signup, login, token refresh, logout and session context (Core engine).'
  - name: Profile & KYC
    description: 'Fayda national-ID verification. Currently a mock implementation.'
  - name: Addresses
    description: 'The authenticated user''s saved delivery/business addresses.'
  - name: Businesses & Documents
    description: 'Business profiles and their uploaded licence/verification documents.'
  - name: Catalog
    description: 'Read-only reference data: categories, units and catalog products.'
  - name: Aggregator Feed
    description: 'Aggregator-published listings — the retailer app''s product feed.'
  - name: Listings
    description: 'Suppliers'' own listings and their activate/pause lifecycle.'
  - name: Supplier Products
    description: 'Supplier price/stock offers, their approval flow, and catalog-inclusion requests.'
  - name: RFQ
    description: 'Buyer-initiated requests for quotation and supplier responses.'
  - name: Quotations
    description: 'Supplier bids on RFQs, and their send/accept/reject lifecycle.'
  - name: Orders
    description: 'Order placement and the validate → split → supplier-confirm → retailer-confirm lifecycle.'
  - name: Retailers & Agents
    description: 'Retailer registration and agent onboarding/verification.'

paths:
  # ==========================================
  # CORE ENGINE: Authentication
  # ==========================================
  /core/auth/signup:
    post:
      tags: [Auth]
      summary: User & Role Signup (Retailer / Agent)
      description: >-
        Registers a new user account. When an `agent` or `retailer` object is included, the matching
        marketplace profile is created in the same transaction and the role code assigned is `AGENT`
        or `RETAILER` respectively (otherwise `USER`).


        Retailer signup accepts a canonical top-level `address` object. Its numeric latitude and
        longitude create a `shipping` address, and the legacy retailer `location` string is derived
        from those coordinates. If `address` is omitted, a strict non-zero `"latitude,longitude"`
        legacy value is accepted. Invalid coordinates fail the entire registration with 422.


        If a Bearer token is sent, the retailer is attributed to the `Agent` owned by that token's
        user and `onboarded_at` is stamped.


        Note: the server enforces only uniqueness on `email` / `phone`. There is no format or length
        validation on email, phone, or password — the `+251…` phone shape is a client convention.
      operationId: signupUser
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user:
                  type: object
                  description: At least one of `email` or `phone` must be present.
                  properties:
                    email:
                      type: string
                      format: email
                      example: retailer@example.com
                    phone:
                      type: string
                      example: '+251911223344'
                    password:
                      type: string
                      format: password
                      example: securepass123
                    password_confirmation:
                      type: string
                      format: password
                      example: securepass123
                    temp_password:
                      type: string
                      description: Optional; set automatically on create when omitted.
                    user_profile_attributes:
                      type: object
                      description: Profile details. Address is not a profile attribute; use the top-level `address` object.
                      properties:
                        first_name:
                          type: string
                          example: Abebe
                        last_name:
                          type: string
                          example: Kebede
                        gender:
                          type: string
                          enum: [male, female]
                        date_of_birth:
                          type: string
                          format: date
                          example: '1990-01-01'
                agent:
                  type: object
                  description: Present ⇒ create a `Dscf::Marketplace::Agent` and assign the `AGENT` role.
                  required: [name, phone, service_area]
                  properties:
                    name:
                      type: string
                      example: Bole Agent PLC
                    phone:
                      type: string
                      example: '+251911223344'
                    service_area:
                      type: string
                      example: Bole Subcity
                    fayda_number:
                      type: string
                      description: Not validated at signup. The Fayda endpoint expects 12 digits.
                      example: '123456789012'
                retailer:
                  type: object
                  description: Present ⇒ create a `Dscf::Marketplace::Retailer` and assign the `RETAILER` role.
                  required: [name]
                  properties:
                    name:
                      type: string
                      example: Bole Corner Store
                    phone:
                      type: string
                      description: Optional; derived from `user.phone`. If supplied, it must match.
                      example: '+251911998877'
                    tin_number:
                      type: string
                      example: '1234567890'
                    location:
                      type: string
                      description: Legacy strict `latitude,longitude` fallback, used only when `address` is omitted.
                      example: '9.0115,38.7578'
                    branch_count:
                      type: integer
                      minimum: 1
                      nullable: true
                    preferred_category_ids:
                      type: array
                      uniqueItems: true
                      items: { type: integer }
                address:
                  $ref: '#/components/schemas/RegistrationAddress'
      responses:
        '201':
          description: Signup successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    type: string
                    example: Account created successfully. Please log in to continue.
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/AuthUser'
                      retailer:
                        $ref: '#/components/schemas/Retailer'
                      address:
                        $ref: '#/components/schemas/Address'
        '422':
          description: Validation error, or `Either email or phone must be provided.`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /core/auth/login:
    post:
      tags: [Auth]
      summary: User Login
      description: >-
        Exchanges credentials for JWT tokens.


        **The identifier field is `email_or_phone`, not `email`.** It is read from the top level
        (`email_or_phone`) or from a nested `auth` object (`auth[email_or_phone]`); `password`
        likewise. Both forms are accepted.
      operationId: loginUser
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email_or_phone, password]
              properties:
                email_or_phone:
                  type: string
                  description: Email address or phone number.
                  example: retailer@example.com
                password:
                  type: string
                  format: password
                  example: securepass123
                auth:
                  type: object
                  description: Alternative nesting; used when the top-level keys are absent.
                  properties:
                    email_or_phone: { type: string }
                    password: { type: string, format: password }
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Login successful. }
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/AuthUser'
                      access_token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiJ9...
                      refresh_token:
                        type: string
                        description: The raw refresh token string (not the RefreshToken record).
                        example: 9f1c2b4e8a...
        '400':
          description: '`Missing credentials` — neither identifier nor password supplied.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`Invalid credentials.` — also returned for a suspended account.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /core/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh Access Token
      description: >-
        Exchanges a valid refresh token for a new access token. Public — no Bearer token required.
        Returns only `access_token`; the refresh token is not rotated.
      operationId: refreshToken
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  example: 9f1c2b4e8a...
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Token refreshed successfully. }
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
        '401':
          description: '`Invalid refresh token.`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /core/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Revokes the supplied refresh token. Requires a Bearer token.
      operationId: logoutUser
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Omitting it still returns 200, but nothing is revoked.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Logged out successfully. }

  /core/auth/me:
    get:
      tags: [Auth]
      summary: Retrieve Authenticated User Context
      description: >-
        Returns the current session's user under `data.user`, serialized with `UserAuthSerializer`
        and including `user_profile` and `roles` (with each role's `permissions`).


        **This endpoint does not return addresses.** Use `GET /core/addresses`.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session synced successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Profile fetched successfully. }
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # CORE ENGINE: KYC
  # ==========================================
  /core/fayda/verify:
    post:
      tags: [Profile & KYC]
      summary: Fayda National ID Verification (MOCK)
      description: >-
        **Public — no Bearer token required, and no OTP is involved.**


        The current implementation is a stub: it checks that `fayda_number` is exactly 12 digits
        (`\A\d{12}\z`) and returns hard-coded identity data. It never contacts the national registry
        and never persists anything.
      operationId: verifyFayda
      security: []   # public — authentication is skipped on this action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fayda_number]
              properties:
                fayda_number:
                  type: string
                  pattern: '^\d{12}$'
                  example: '123456789012'
      responses:
        '200':
          description: Identity "verified" (mock data)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      verified: { type: boolean, example: true }
                      fayda_number: { type: string, example: '123456789012' }
                      full_name: { type: string, example: Mock Person }
                      gender: { type: string, example: Male }
                      date_of_birth: { type: string, example: '1990-01-01' }
                      verification_date:
                        type: string
                        format: date-time
                        example: '2026-07-24T09:12:33Z'
        '422':
          description: '`fayda_number is required` or `Invalid fayda_number format`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # CORE ENGINE: Businesses & Documents
  # ==========================================
  /core/businesses/my_business:
    get:
      tags: [Businesses & Documents]
      summary: List the Caller's Businesses
      description: >-
        Delegates to the shared `index` action scoped to `current_user.businesses`, so `data` is an
        **array** (empty when the user owns none). Includes `business_type`, `user`, `documents` and
        `reviews`. Supports `page` / `per_page` / `order_by` / `order_direction` and Ransack `q`.
      operationId: getMyBusiness
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/OrderDirection'
        - $ref: '#/components/parameters/RansackQuery'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Businesses retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Businesses retrieved successfully }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Business'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /core/businesses/{id}:
    get:
      tags: [Businesses & Documents]
      summary: Get Business
      operationId: getBusiness
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          example: 5
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Business details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Business details retrieved successfully }
                  data:
                    $ref: '#/components/schemas/Business'

  /core/businesses/{business_id}/documents:
    get:
      tags: [Businesses & Documents]
      summary: Index Business Verification Documents
      operationId: getBusinessDocuments
      security:
        - BearerAuth: []
      parameters:
        - name: business_id
          in: path
          required: true
          schema: { type: integer }
          example: 5
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Documents list fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessDocument'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      tags: [Businesses & Documents]
      summary: Upload Business Document
      description: >-
        Multipart upload. The controller reads **only** `document[file]` and hard-codes
        `document_type` to `business_license` — any `document_type` you send is ignored.
        Multiple files can be attached to one document record over time (`files` is a
        `has_many_attached`), but each request attaches one file.


        The model's `document_type` enum is `business_license | drivers_license | claim`.
      operationId: uploadBusinessDocument
      security:
        - BearerAuth: []
      parameters:
        - name: business_id
          in: path
          required: true
          schema: { type: integer }
          example: 5
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: ['document[file]']
              properties:
                'document[file]':
                  type: string
                  format: binary
                  description: Document file content (e.g. PDF, PNG, JPG).
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Document created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/BusinessDocument'
        '422':
          description: Validation or upload failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /core/businesses/{business_id}/documents/{id}:
    delete:
      tags: [Businesses & Documents]
      summary: Delete Business Document
      operationId: deleteBusinessDocument
      security:
        - BearerAuth: []
      parameters:
        - name: business_id
          in: path
          required: true
          schema: { type: integer }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Document deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: '`Document not found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # CORE ENGINE: Addresses
  # ==========================================
  /core/addresses:
    get:
      tags: [Addresses]
      summary: Get Addresses
      description: Returns the authenticated user's saved addresses, each with its nested `user`.
      operationId: getAddresses
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/RansackQuery'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Addresses loaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      tags: [Addresses]
      summary: Save New Address
      description: >-
        Creates an address owned by the authenticated user. Only `country` is validated for
        presence (the column defaults to `Ethiopia`); `address_type` and `city` are optional.
      operationId: createAddress
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: object
                  properties:
                    address_type:
                      type: string
                      enum: [shipping, residence, current, branch, warehouse, business_hq, pickup_point]
                      example: shipping
                    country: { type: string, example: Ethiopia }
                    city: { type: string, example: Addis Ababa }
                    sub_city: { type: string, example: Kirkos }
                    woreda: { type: string, example: '04' }
                    kebele: { type: string, example: '11' }
                    house_numbers: { type: string, example: '994/B' }
                    po_box: { type: string, example: '10430' }
                    latitude: { type: number, format: double, example: 9.0115 }
                    longitude: { type: number, format: double, example: 38.7578 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Address created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Address'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /core/addresses/{id}:
    get:
      tags: [Addresses]
      summary: Get Address
      description: Scoped to the authenticated user's own addresses.
      operationId: getAddress
      security:
        - BearerAuth: []
      parameters:
