    Order:
      type: object
      description: >-
        `Dscf::Marketplace::OrderSerializer`. Within one seller's order, allocations live on
        `order_items[]`. Since 0.15.0 an order is one of three shapes:


        - **standalone** — `parent_order_id: null`, `sub_orders: []`. Single-seller cart. Read
          `order_items`.

        - **parent** — `parent_order_id: null`, `ordered_to_id: null`, `order_items: []`,
          `sub_orders` populated. The retailer-facing umbrella over a multi-seller cart. Read
          `sub_orders[].order_items`; `total_amount` is the sum of the children and `status`
          tracks the furthest-behind live child.

        - **sub-order** — `parent_order_id` set, `ordered_to_id` set, `order_items` populated.
          One seller's half of a split cart. Never appears in `my_orders`; visible nested under
          its parent and to that seller.


        `parent_order_id == null && sub_orders.length > 0` is the parent test. Which associations
        are nested depends on the action's serializer includes.
      properties:
        id: { type: integer, example: 240 }
        quotation_id: { type: integer, nullable: true }
        listing_id:
          type: integer
          nullable: true
          description: >-
            Single FK, set to the first supplier-`Listing` line in the cart. Null for orders sourced
            entirely from the aggregator feed.
        user_id: { type: integer, example: 42 }
        ordered_by_id: { type: integer, example: 42 }
        ordered_to_id:
          type: integer
          nullable: true
          description: >-
            The `Dscf::Core::Business` fulfilling the order. **Null on a parent order** — it spans
            several businesses; read each child's `ordered_to_id` instead.
          example: 6
        parent_order_id:
          type: integer
          nullable: true
          description: >-
            Set only on a sub-order, pointing at its retailer-facing parent. Null on standalone and
            parent orders. Added in dscf-marketplace 0.15.0.
          example: 239
        delivery_order_id: { type: integer, nullable: true }
        dropoff_address_id: { type: integer, nullable: true, example: 13 }
        agent_id:
          type: integer
          nullable: true
          description: Present for agent-assisted orders; gates the OTP flow.
          example: 7
        order_type:
          type: string
          enum: [rfq_based, direct_listing]
          example: direct_listing
        status:
          type: string
          description: >-
            See "Order Lifecycle" in the API description. **On a parent order** this is derived from
            its sub-orders rather than set directly: the parent sits at the furthest-behind live
            (non-cancelled) child, reaching `confirmed`/`completed` only once every live child has,
            and `cancelled` only when all children are.
          enum:
            - pending
            - validating
            - splitting
            - waiting_supplier_confirmation
            - waiting_retailer_confirmation
            - confirmed
            - processing
            - completed
            - cancelled
          example: waiting_retailer_confirmation
        workflow_status:
          type: string
          description: Duplicate of `status` (the serializer returns `object.status`).
          example: waiting_retailer_confirmation
        has_validation_issues:
          type: boolean
          description: True while any line item's `validation_status` is not `validated`.
          example: false
        fulfillment_type:
          type: string
          enum: [self_pickup, delivery]
          example: delivery
        payment_method:
          type: string
          enum: [cash, credit, bank_transfer]
          description: '`credit` exists on the model but is rejected for new orders.'
          example: cash
        received_bank_name:
          type: string
          nullable: true
          description: Cleared automatically when `payment_method` is `cash`; required to complete a `bank_transfer` order.
        transaction_reference:
          type: string
          nullable: true
          description: Cleared automatically when `payment_method` is `cash`; required to complete a `bank_transfer` order.
        total_amount:
          type: string
          description: >-
            Sum over non-cancelled lines only; recalculated on every save. **On a parent order** it
            is instead the sum of its sub-orders' totals, synced whenever a child changes.
          example: '3500.00'
        buyer_name:
          type: string
          nullable: true
          description: The `Retailer.name` linked to `ordered_by` (users have no name field).
          example: Bole Corner Store
        buyer_phone: { type: string, nullable: true, example: '+251934623433' }
        buyer_email: { type: string, nullable: true, example: retailer@example.com }
        seller_name:
          type: string
          nullable: true
          description: '`ordered_to.name` — the aggregator/business the order was placed with.'
          example: Addis Aggregators
        seller_phone: { type: string, nullable: true, example: '+251911000012' }
        seller_email: { type: string, nullable: true }
        created_at: { type: string, format: date-time, example: '2026-06-25T14:45:00.000Z' }
        updated_at: { type: string, format: date-time }
        order_items:
          type: array
          description: Always empty on a parent order — its lines live on `sub_orders[].order_items`.
          items:
            $ref: '#/components/schemas/OrderItem'
        sub_orders:
          type: array
          description: >-
            Per-business sub-orders of a parent order; empty (`[]`) for standalone and sub-orders.
            Each entry is a full Order with its own `ordered_to_id`, `status`, `total_amount` and
            `order_items`. Added in dscf-marketplace 0.15.0. Nested wherever the serializer include
            `sub_orders.order_items` is passed — `create`, `show`, `index`, `update` and
            `my_orders` all pass it.
          items:
            $ref: '#/components/schemas/Order'
        ordered_by:
          type: object
          nullable: true
          description: Nested buyer user.
        ordered_to:
          type: object
          nullable: true
          description: Nested seller `Business`. Null on a parent order.
        dropoff_address:
          description: Nested delivery address; null for self-pickup orders.
          allOf:
            - $ref: '#/components/schemas/Address'

    OrderItem:
      type: object
      properties:
        id: { type: integer, example: 480 }
        order_id: { type: integer, example: 240 }
        quotation_item_id: { type: integer, nullable: true }
        listing_id: { type: integer, nullable: true }
        product_id: { type: integer, example: 20 }
        product_name: { type: string, nullable: true, example: Yirgacheffe Arabica }
        product_sku: { type: string, nullable: true }
        unit_id: { type: integer, example: 9 }
        unit_name: { type: string, nullable: true, example: Kilogram }
        quantity: { type: string, example: '10.0' }
        unit_price:
          type: string
          description: Agreed unit price for this line (the order's price, not the live listing's).
          example: '350.00'
        subtotal: { type: string, example: '3500.00' }
        status:
          type: string
          description: >-
            Per-allocation state. `processing` = awaiting supplier/aggregator confirmation;
            `adjusted` = the supplier proposed revised terms awaiting the aggregator's
            accept/reject; `cancelled` = not confirmed and dropped from the total.
          enum: [pending, confirmed, processing, fulfilled, cancelled, adjusted]
          example: confirmed
        validation_status:
          type: string
          description: Result of validating the line against the current listing. Defaults to `validated`.
          enum: [validated, no_longer_listed, price_changed, low_quantity]
          example: validated
        validation_note:
          type: string
          nullable: true
          example: 'Price changed (listed: 500.0)'
        resolved_unit_price:
          type: string
          nullable: true
          description: Audit trail of the price the aggregator settled on; also applied to `unit_price`.
          example: '500.00'
        resolved_quantity:
          type: string
          nullable: true
          description: Audit trail of the quantity the aggregator settled on; also applied to `quantity`.
        supplier_adjusted_unit_price:
          type: string
          nullable: true
          description: Supplier's proposed price while `status == adjusted`; cleared on accept.
        supplier_adjusted_quantity:
          type: string
          nullable: true
          description: Supplier's proposed quantity while `status == adjusted`; cleared on accept.
        supplier_adjustment_note: { type: string, nullable: true }
        source_id: { type: integer, nullable: true, example: 14 }
        source_type:
          type: string
          nullable: true
          description: >-
            Polymorphic source fulfilling this line. Feed orders auto-source `supplier`-kind listings
            straight to the fulfilling `Dscf::Core::Business`; `catalog` and `sub_supplier` listings
            stay on the `AggregatorListing`. The aggregator can reassign it during splitting; a
            self-fulfilled line has `source_type: null`.
          enum:
            - Dscf::Marketplace::AggregatorListing
            - Dscf::Marketplace::SubSupplier
            - Dscf::Marketplace::Supplier
            - Dscf::Core::Business
          example: Dscf::Core::Business
        source_name:
          type: string
          nullable: true
          description: Display name of the assigned source. Null when unsourced or when `source_type` is unresolvable.
          example: Kaffa Growers Co-op
        thumbnail_url: { type: string, nullable: true }
        images_urls:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Retailer:
      type: object
      properties:
        id: { type: integer, example: 31 }
        name: { type: string, example: Bole Corner Store }
        phone: { type: string, example: '+251911998877' }
        tin_number: { type: string, nullable: true, example: '1234567890' }
        location:
          type: string
          description: '`"latitude,longitude"`. NOT NULL.'
          example: '9.0115,38.7578'
        branch_count:
          type: integer
          minimum: 1
          nullable: true
          example: 2
        preferred_category_ids:
          type: array
          uniqueItems: true
          items: { type: integer }
          example: [1, 4]
        status:
          type: string
          enum: [active, inactive, suspended]
          example: active
        agent_id: { type: integer, nullable: true, example: 7 }
        onboarded_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        shipping_address:
          allOf:
            - $ref: '#/components/schemas/Address'
          nullable: true
        agent:
          description: The onboarding agent; null for self-registered retailers.
          allOf:
            - $ref: '#/components/schemas/Agent'

    Agent:
      type: object
      properties:
        id: { type: integer, example: 7 }
        code:
          type: string
          description: Auto-generated as `AGT-XXXXXXXX`.
          example: AGT-3F9A21B7
        name: { type: string, example: Bole Agent PLC }
        phone: { type: string, example: '+251911223344' }
        service_area: { type: string, example: Bole Subcity }
        sub_city: { type: string, nullable: true, example: Bole }
        woreda: { type: string, nullable: true, example: '03' }
        status:
          type: string
          enum: [active, inactive, suspended]
          example: active
        fayda_number: { type: string, nullable: true, example: '123456789012' }
        verification_status:
          type: string
          enum: [pending, verified, rejected, under_review]
          example: pending
        gender: { type: string, nullable: true }
        rejection_reason: { type: string, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }
        modified_at: { type: string, format: date-time, nullable: true }
        onboarded_by_id: { type: integer, nullable: true }
        photo_url: { type: string, nullable: true }
        national_id_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
