                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/SupplierProduct'

  /marketplace/supplier_products/{id}/reject:
    post:
      tags: [Supplier Products]
      summary: Reject Supplier Product (admin)
      description: 'Sets `status: inactive`, stores `rejection_reason` and stamps `rejected_at`. `reason` is required.'
      operationId: rejectSupplierProduct
