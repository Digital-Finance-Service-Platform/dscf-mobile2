      tags: [Supplier Products]
      summary: Approve Supplier Product (admin)
      description: 'Sets `status: active` and stamps `approved_at`. An optional `reason` is stored in `rejection_reason`.'
      operationId: approveSupplierProduct
      security:
        - BearerAuth: []
