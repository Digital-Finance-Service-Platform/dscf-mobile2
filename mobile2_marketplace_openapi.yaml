      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: Price is above the approved ceiling. }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
